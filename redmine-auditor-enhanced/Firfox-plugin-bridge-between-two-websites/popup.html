<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      color: #222;
    }
    .header {
      background: #cc0000;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 { font-size: 15px; font-weight: bold; }
    .header .version { font-size: 10px; opacity: 0.7; margin-top: 2px; }
    .section {
      padding: 12px 14px;
      border-bottom: 1px solid #e0e0e0;
    }
    .section-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      background: #cc0000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      transition: background 0.15s;
    }
    button:hover { background: #a80000; }
    button.secondary {
      background: #444;
    }
    button.secondary:hover { background: #222; }
    button.blue {
      background: #0055cc;
    }
    button.blue:hover { background: #003d99; }
    button.small {
      width: auto;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 4px;
      margin: 0;
    }
    button.danger {
      background: transparent;
      color: #cc0000;
      border: 1px solid #cc0000;
      padding: 3px 8px;
      font-size: 11px;
      width: auto;
      margin: 0;
      border-radius: 4px;
    }
    button.danger:hover { background: #fff0f0; }
    #tickets-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .ticket-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .ticket-item .ticket-info {
      flex: 1;
      overflow: hidden;
    }
    .ticket-id { color: #cc0000; font-weight: bold; font-size: 11px; }
    .ticket-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; color: #333; }
    .ticket-ts { font-size: 10px; color: #999; }
    .actions-row { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    #status {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      min-height: 16px;
    }
    .empty-state {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      padding: 10px 0;
    }
    .badge {
      display: inline-block;
      background: #cc0000;
      color: white;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🔴 Redmine Auditor</h1>
      <div class="version">v2.0 · AI-Powered</div>
    </div>
  </div>

  <!-- Current ticket -->
  <div class="section">
    <div class="section-title">Current Ticket</div>
    <button id="openSplitBtn">⚡ Launch Split Screen</button>
    <button id="addTicketBtn" class="secondary">➕ Save to Multi-Ticket Queue</button>
    <div id="status"></div>
  </div>

  <!-- Multi-ticket queue -->
  <div class="section">
    <div class="section-title">
      Multi-Ticket Queue
      <span class="badge" id="ticket-count">0</span>
    </div>
    <div id="tickets-list">
      <div class="empty-state" id="empty-msg">No saved tickets yet.</div>
    </div>
    <button id="bulkSummarizeBtn" class="blue" style="margin-top:8px">📋 Bulk Summarize All</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
